[project]
name = "hindsight-guild"
version = "0.2.0"
description = "Hindsight Guild — a marketing team of one's own for solo founders, that remembers, learns, and levels up. Built on Gemini + MongoDB Atlas (ADK + A2A + Vertex AI Eval + MongoDB MCP)."
requires-python = ">=3.12"
readme = "README.md"

# Pinned versions matter: ADK 1.x APIs (callback context, MCPToolset, A2A,
# AgentTool, output_key) evolved across 2025-2026. Loosen only after running
# tests/integration/test_smoke.py against your install.
dependencies = [
  "google-adk>=1.0,<2.0",
  "google-cloud-aiplatform[evaluation]>=1.71,<2.0",  # PointwiseMetric + eval task
  "google-cloud-bigquery>=3.25,<4.0",
  "google-cloud-storage>=2.18,<3.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "google-cloud-logging>=3.10,<4.0",
  "google-genai>=1.0,<2.0",
  "google-ads>=24.0,<32.0",                          # Google Ads outcome source
                                                      # widened upper bound — 24.x/25.x
                                                      # require Python <3.13, 26.0+ supports 3.13.
                                                      # GoogleAdsClient import path stable across.
  "pymongo>=4.7,<5.0",
  "pydantic>=2.7,<3.0",
  "pandas>=2.2,<3.0",                                # vertexai.evaluation surface
  "structlog>=24.0,<26.0",
  "tenacity>=8.3,<10.0",
  "flask>=3.0,<4.0",
  "httpx>=0.27,<1.0",
  "gunicorn>=22.0,<24.0",
  "uvicorn>=0.30,<1.0",                              # A2A server transport
  "a2a-sdk>=0.2,<1.0",                               # A2A types + JSON-RPC primitives
  "pyyaml>=6.0,<7.0",                                # SKILL.md frontmatter parsing
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-mock>=3.14,<4.0",
  "ruff>=0.5,<1.0",
]
# Per-service dependency groups. Versions come from the main `dependencies`
# list above — this section just selects subsets per Cloud Run image.
# When bumping a version, update it once in `dependencies` and every group
# inherits the new pin.
web-api = [
  "fastapi",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "google-cloud-bigquery>=3.25,<4.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "pymongo>=4.7,<5.0",
  "pydantic>=2.7,<3.0",
]
worker-bq = [
  "google-cloud-bigquery>=3.25,<4.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "pymongo>=4.7,<5.0",
  "pydantic>=2.7,<3.0",
]
worker-eval = [
  "google-cloud-aiplatform[evaluation]>=1.71,<2.0",
  "google-cloud-bigquery>=3.25,<4.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "pymongo>=4.7,<5.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.7,<3.0",
]
worker-snapshot = [
  "google-cloud-storage>=2.18,<3.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "pymongo>=4.7,<5.0",
  "pydantic>=2.7,<3.0",
]
worker-a2a-client = [
  "httpx>=0.27,<1.0",
  "google-cloud-secret-manager>=2.20,<3.0",
]
worker-publish-sweep = [
  "httpx>=0.27,<1.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "pymongo>=4.7,<5.0",
]
http-publisher = [
  "flask>=3.0,<4.0",
  "gunicorn>=22.0,<24.0",
  "httpx>=0.27,<1.0",
  "tenacity>=8.3,<10.0",
  "google-cloud-bigquery>=3.25,<4.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "pymongo>=4.7,<5.0",
  "pydantic>=2.7,<3.0",
]
http-handler-edit = [
  "flask>=3.0,<4.0",
  "gunicorn>=22.0,<24.0",
  "google-cloud-bigquery>=3.25,<4.0",
  "google-cloud-secret-manager>=2.20,<3.0",
  "pymongo>=4.7,<5.0",
]
http-handler-slack = [
  "flask>=3.0,<4.0",
  "gunicorn>=22.0,<24.0",
  "httpx>=0.27,<1.0",
  "google-cloud-secret-manager>=2.20,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "shared", "services", "demo"]
