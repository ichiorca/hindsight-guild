name: ci

# Lint + unit tests gate. Runs on every PR + push to main. Stays cloud-free:
# unit tests are mocked, integration tests are gated on INTEGRATION_TEST=1
# and skipped here.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: ruff + pytest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit -q
